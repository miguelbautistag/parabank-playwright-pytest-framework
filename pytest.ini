[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: High-priority core business flows
    regression: Complete system functional regression suite
    ui: End-to-End User Interface tests requiring Playwright browser context
    api: REST API service layer validations
    negative: Edge cases, negative validation, and invalid input scenarios
    datadriven: Parameterized tests executing across dynamic data sets
